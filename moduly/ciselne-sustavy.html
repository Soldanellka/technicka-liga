<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Číselné sústavy – študijný modul</title>
<script>
/* Téma sa riadi tým istým nastavením ako zvyšok appky: kľúč lex_theme
   v localStorage, ktorý zapisuje theme.js. Appka má predvolene svetlú
   tému a preferenciu systému ignoruje, preto sa pri chýbajúcej hodnote
   nastaví "light" – tým sa zároveň vypne blok @media (prefers-color-scheme)
   nižšie, ktorý má presne na to stráž :root:not([data-theme="light"]).
   Beží v <head> pred vykreslením, aby stránka neblikla svetlou témou.
   localStorage v súkromnom režime Safari hádže už pri čítaní – fail-soft
   na svetlú tému, rovnako ako to robí zvyšok appky. */
(function(){
  var t = "light";
  try { if (localStorage.getItem("lex_theme") === "dark") t = "dark"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
/* ============================================================
   Rozloženie je prevzaté zo študijného modulu LexAreny
   (ob-pravo-app: .header / .sidebar s krúžkom progresu /
   .welcome-screen s tromi štatistikami). Prevzala sa KOSTRA,
   nie vzhľad – paleta aj písmo sú z Finančnej ligy (styles.css),
   ružová #ff6f91 ani Google Fonts sa sem nedostali.
============================================================ */
:root{
  /* Paleta prevzatá zo styles.css, nech modul sedí so zvyškom appky:
     --bg/--panel/--ink/--muted sú 1:1 appkové --bg/--surface/--text/--muted,
     --accent je appkové --accent-2, --ok vychádza zo zelenej #15803d,
     ktorú appka používa na potvrdenia. --line, --accent-soft a --bit-off
     appka nemá, sú odvodené z --accent-1 a overené na kontrast. */
  --bg:#f5faf9; --panel:#ffffff; --ink:#14262c; --muted:#54706b; --line:#d9e8e4;
  --accent:#17806f; --accent-soft:#e4f2ef;
  --ok:#15803d; --ok-bg:#e7f6ed; --bad:#ef4444; --bad-bg:#fdeced;
  --bit-off:#eaf3f1;
  --radius:14px;
  --shadow:0 4px 20px rgba(16,16,16,.06);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --panel:#0f1724; --ink:#e6eef6; --muted:#9aa6b2; --line:#23314a;
    --accent:#7cc1e3; --accent-soft:#16283c;
    --ok:#4ade80; --ok-bg:#14301f; --bad:#f87171; --bad-bg:#3a1f22; --bit-off:#17202e;
    --shadow:0 8px 28px rgba(2,6,23,.6);
  }
}
:root[data-theme="dark"]{
  /* ⚠️ Rovnaké hodnoty ako v bloku @media vyššie – appka tmavú tému riadi
     atribútom data-theme, preferencia systému je len záloha. */
  --bg:#0b1220; --panel:#0f1724; --ink:#e6eef6; --muted:#9aa6b2; --line:#23314a;
  --accent:#7cc1e3; --accent-soft:#16283c;
  --ok:#4ade80; --ok-bg:#14301f; --bad:#f87171; --bad-bg:#3a1f22; --bit-off:#17202e;
  --shadow:0 8px 28px rgba(2,6,23,.6);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Obsah okruhu dostáva ohnisko programovo (kvôli čítačkám obrazovky pri
   prepnutí okruhu), nie je to ovládací prvok – viditeľný prstenec okolo
   celého panela by bol len vizuálny šum. Prvky, ktoré sa dajú ovládať
   klávesnicou, si prstenec ponechávajú. */
#okruhDetail:focus,#okruhDetail:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── HORNÁ LIŠTA ── */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.back-link{display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:600;background:none;border:0;cursor:pointer;font-family:inherit;
  padding:4px 2px;transition:color .2s}
.back-link:hover{color:var(--accent)}
.header-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;
  color:var(--ink);min-width:0}
.header-title span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-dot{width:8px;height:8px;border-radius:999px;background:var(--accent);flex-shrink:0}
.theme-btn{background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px;
  cursor:pointer;color:var(--muted);display:flex;align-items:center;transition:all .2s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── MRIEŽKA ── */
.app-container{display:flex;gap:24px;padding:20px 24px calc(40px + env(safe-area-inset-bottom,0px));
  max-width:1200px;margin:0 auto;align-items:flex-start}

/* ── ZOZNAM OKRUHOV ── */
.sidebar{width:280px;flex-shrink:0;background:var(--panel);border-radius:var(--radius);
  border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;
  position:sticky;top:78px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.sidebar-header{display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--accent-soft)}
.sidebar-header h2{font-size:14px;font-weight:700;color:var(--ink);margin:0}
.progress-ring-wrap{position:relative;width:48px;height:48px;flex-shrink:0}
.progress-ring{display:block}
.progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--accent)}
.okruhy-list{overflow-y:auto;flex:1;padding:8px}
.okruh-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  cursor:pointer;transition:background .18s,border-color .18s,color .18s;font-size:13px;
  color:var(--ink);border:1.5px solid transparent;width:100%;text-align:left;
  background:none;font-family:inherit}
.okruh-item:hover{background:var(--accent-soft)}
.okruh-item.active{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:600}
.okruh-num{font-size:11px;font-weight:700;color:var(--muted);min-width:28px;flex-shrink:0}
.okruh-item.active .okruh-num{color:var(--accent)}
.okruh-title{flex:1;min-width:0}
.okruh-status{color:var(--ok);font-weight:700;flex-shrink:0}

/* ── OBSAH ── */
.content{flex:1;min-width:0}

/* ── UVÍTACÍ PANEL ── */
.welcome-screen{text-align:center;padding:48px 20px}
.welcome-icon{font-size:56px;margin-bottom:16px;line-height:1}
.welcome-title{font-size:32px;font-weight:700;color:var(--ink);margin:0 0 10px}
.welcome-sub{color:var(--muted);margin:0 0 28px}
.welcome-stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stat-box{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px 24px;min-width:96px;box-shadow:var(--shadow)}
.stat-num{font-size:28px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}

/* ── TYPOGRAFIA OBSAHU KAPITOLY ── */
h1{font-size:2rem;line-height:1.15;margin:0 0 6px}
h2{font-size:1.5rem;line-height:1.25;margin:0 0 14px}
h3{font-size:1.1rem;margin:32px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
p{margin:0 0 12px}
.num{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  overflow-x:auto;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:15px;
  line-height:1.5;margin:0 0 14px}
.tbl{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;min-width:100%;background:var(--panel);font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center}
th{background:var(--accent-soft);font-weight:600}
td:first-child,th:first-child{text-align:left}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.note b{display:block;margin-bottom:2px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin-bottom:4px}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px}
summary{cursor:pointer;font-weight:600}

/* ── PREPÍNAČE BITOV ── */
.bits{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.bits-row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.bit{font:inherit;cursor:pointer;border:2px solid var(--line);border-radius:10px;background:var(--bit-off);
  color:var(--muted);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:background .15s,border-color .15s,color .15s}
.bit .v{font-family:ui-monospace,Consolas,monospace;font-size:1.6rem;font-weight:700;line-height:1}
.bit .w{font-size:12px}
.bit[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.bits-out{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.bits-out .big{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.bits-out .sum{color:var(--muted);font-variant-numeric:tabular-nums}

/* ── OTÁZKY (kroky prípadu + kvíz) ── */
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qn{color:var(--muted);font-weight:400;font-size:14px;display:block}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb strong{display:block}
.case-intro{margin-bottom:12px}
.score{font-weight:600;padding:12px 14px;border-radius:10px;background:var(--accent-soft);display:none}
.score.show{display:block}
.btn{font:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--panel);
  border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:32px;flex-wrap:wrap}

/* ── MOBIL ──
   LexArena pri ≤768 px len poskladá zoznam nad obsah a stlačí ho do
   220 px vysokého skrolovacieho boxu, takže na telefóne sú oba panely
   naraz a ani jeden poriadne. Tu preto platí zadanie: najprv zoznam
   (aj s uvítacím panelom a štatistikami), ťuknutie otvorí kapitolu,
   šípka späť v lište vráti na zoznam. Prepína sa atribútom
   data-view na <body>, takže !important premôže aj inline display,
   ktorý nastavuje JS pre desktop. */
@media (max-width:768px){
  .app-container{flex-direction:column;gap:16px;padding:16px 14px 32px}
  .sidebar{width:100%;position:static;max-height:none;order:2}
  .content{width:100%;order:1}
  .welcome-screen{padding:20px 4px 4px}
  .welcome-icon{font-size:44px;margin-bottom:10px}
  .welcome-title{font-size:24px}
  .welcome-sub{margin-bottom:20px}
  .stat-box{padding:14px 18px;min-width:88px}
  body[data-view="list"] #welcomeScreen{display:block!important}
  body[data-view="list"] #okruhDetail{display:none!important}
  body[data-view="detail"] #welcomeScreen{display:none!important}
  body[data-view="detail"] #okruhDetail{display:block!important}
  body[data-view="detail"] .sidebar{display:none}
}
@media (max-width:420px){
  body{font-size:16px}
  h2{font-size:1.3rem}
  .bit .v{font-size:1.25rem} .bits-row{gap:4px} .bits{padding:12px}
  .stat-box{padding:12px 14px;min-width:0;flex:1}
  .welcome-stats{gap:10px}
  .header{padding-left:14px;padding-right:14px}
  .header-title{font-size:15px}
}
</style>
</head>
<body data-view="list">

<header class="header">
  <button class="back-link" id="backBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    <span id="backLabel">Finančná liga</span>
  </button>
  <div class="header-title"><span class="logo-dot"></span><span class="t">Číselné sústavy</span></div>
  <button class="theme-btn" id="themeBtn" type="button" title="Prepnúť tému" aria-label="Prepnúť tému">
    <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
</header>

<main class="app-container">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Okruhy</h2>
      <div class="progress-ring-wrap">
        <svg class="progress-ring" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="20" fill="none" stroke="var(--line)" stroke-width="4"/>
          <circle id="progressRing" cx="24" cy="24" r="20" fill="none"
            stroke="var(--accent)" stroke-width="4"
            stroke-dasharray="125.6" stroke-dashoffset="125.6"
            stroke-linecap="round" transform="rotate(-90 24 24)"/>
        </svg>
        <span id="progressText" class="progress-text">0%</span>
      </div>
    </div>
    <div id="okruhyList" class="okruhy-list"></div>
  </aside>

  <section class="content">

    <div id="welcomeScreen" class="welcome-screen">
      <div class="welcome-icon">🔢</div>
      <h1 class="welcome-title">Číselné sústavy</h1>
      <p class="welcome-sub">Vyber okruh zo zoznamu a začni študovať.</p>
      <div class="welcome-stats">
        <div class="stat-box">
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-label">okruhov</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statDone">0</div>
          <div class="stat-label">dokončených</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statCorrect">—</div>
          <div class="stat-label">správnych</div>
        </div>
      </div>
    </div>

    <div id="okruhDetail" tabindex="-1" style="display:none"></div>

  </section>

</main>

<script>
(function(){
"use strict";

/* ---------- content ---------- */
var CH = [
{
 id:"k1", short:"1. Pozičná váha", title:"Kapitola 1: Čo je číselná sústava",
 html:
 '<p>Tá istá číslica má inú hodnotu podľa toho, na ktorom mieste stojí. Trojka v čísle 300 znamená tristo, v čísle 3 len tri.</p>'+
 '<div class="note"><b>Prirovnanie – peniaze</b>Máš bankovky po 1000 €, 100 €, 10 € a mince po 1 €. Číslo 7438 znamená 7 tisícoviek, 4 stovky, 3 desiatky a 8 jednotiek. Hodnote „bankovky“ na danom mieste hovoríme <strong>pozičná váha</strong>.</div>'+
 '<p>Desiatková sústava má 10 číslic (0 až 9) a každá ďalšia pozícia zľava je 10-krát väčšia:</p>'+
 '<div class="tbl"><table><tr><th>Pozícia</th><th>3</th><th>2</th><th>1</th><th>0</th></tr>'+
 '<tr><td>Váha</td><td>10³ = 1000</td><td>10² = 100</td><td>10¹ = 10</td><td>10⁰ = 1</td></tr>'+
 '<tr><td>Číslica v 7438</td><td>7</td><td>4</td><td>3</td><td>8</td></tr></table></div>'+
 '<pre>7438 = 7·10³ + 4·10² + 3·10¹ + 8·10⁰\n     = 7000 + 400 + 30 + 8</pre>'+
 '<p>Pravidlá, ktoré treba vedieť naspamäť:</p>'+
 '<ul><li>Pozície sa číslujú <strong>sprava od nuly</strong>: úplne vpravo je pozícia 0.</li>'+
 '<li>Čokoľvek na nultú je 1 (10⁰ = 1, 2⁰ = 1, 16⁰ = 1).</li>'+
 '<li>Základ sústavy sa píše malým číslom vpravo dole: 365₁₀, 101₂, 1D8E₁₆.</li>'+
 '<li>Sústava so základom z má presne z číslic, od 0 po z − 1. V dvojkovej sú len 0 a 1, v osmičkovej neexistuje číslica 8.</li></ul>',
 caseIntro:"Rozlož číslo 8664₁₀ podľa pozičných váh.",
 steps:[
  {q:"Na ktorej pozícii stojí osmička úplne vľavo?",o:["0","1","3","4"],c:2,ex:"Pozície ideme sprava od 0: 4 je na pozícii 0, šestky na 1 a 2, osmička na 3."},
  {q:"Akú váhu má pozícia 3 v desiatkovej sústave?",o:["3","30","100","1000"],c:3,ex:"Váha pozície 3 je 10³ = 1000."},
  {q:"Ako znie celý rozpis?",o:["8·10³ + 6·10² + 6·10¹ + 4·10⁰","8·10⁴ + 6·10³ + 6·10² + 4·10¹","4·10³ + 6·10² + 6·10¹ + 8·10⁰","8 + 6 + 6 + 4"],c:0,ex:"8·1000 + 6·100 + 6·10 + 4·1 = 8000 + 600 + 60 + 4 = 8664."}
 ],
 quiz:[
  {q:"Koľko je 5⁰?",o:["0","5","1","Nedá sa vypočítať"],c:2,ex:"Akékoľvek číslo (okrem nuly) na nultú je 1."},
  {q:"Ktorá číslica v osmičkovej sústave neexistuje?",o:["0","7","8","1"],c:2,ex:"Osmičková sústava má číslice 0 až 7, teda 8 číslic."},
  {q:"V čísle 365₁₀ má šestka hodnotu:",o:["6","60","600","36"],c:1,ex:"Šestka je na pozícii 1 s váhou 10¹ = 10, teda 6·10 = 60."}
 ]
},
{
 id:"k2", short:"2. Dvojková → desiatková", title:"Kapitola 2: Dvojková sústava",
 html:
 '<p>Počítač pozná iba dva stavy: prúd tečie (1) alebo netečie (0). Preto počíta v dvojkovej sústave, kde sú len číslice 0 a 1 a každá pozícia je <strong>2-krát</strong> väčšia ako tá napravo.</p>'+
 '<div class="note"><b>Prirovnanie – rad vypínačov</b>Osem žiaroviek vedľa seba, každá má svoju „cenu“: najpravejšia 1, potom 2, 4, 8, 16, 32, 64, 128. Číslo zistíš tak, že sčítaš ceny žiaroviek, ktoré svietia.</div>'+
 '<p>Vyskúšaj si to: klikaj na bity a sleduj, ako sa mení číslo.</p>'+
 '<div class="bits" id="bits"><div class="bits-row" id="bitsRow"></div>'+
 '<div class="bits-out"><span class="big num" id="bitsBin"></span><span class="big" id="bitsDec"></span><span class="sum" id="bitsSum"></span></div></div>'+
 '<p><strong>Postup prevodu dvojkové → desiatkové:</strong></p>'+
 '<ol><li>Nad každú číslicu napíš jej váhu (sprava 1, 2, 4, 8…).</li><li>Vyber váhy, pod ktorými je 1. Nuly preskoč.</li><li>Sčítaj ich.</li></ol>'+
 '<pre>váhy:  8 4 2 1\nbity:  1 1 0 1\n1101₂ = 8 + 4 + 0 + 1 = 13₁₀</pre>'+
 '<div class="note"><b>Bit a bajt</b>Jedna číslica 0 alebo 1 je <strong>bit</strong>. Osem bitov je <strong>bajt</strong>. Najväčšie číslo v bajte je 11111111₂ = 255, takže sa doň zmestí 256 hodnôt (0 až 255, aj s nulou).</div>',
 caseIntro:"Preveď 01011001₂ do desiatkovej sústavy.",
 steps:[
  {q:"Akú váhu má bit úplne vľavo (pozícia 7)?",o:["64","128","256","8"],c:1,ex:"2⁷ = 128. Váhy sprava: 1, 2, 4, 8, 16, 32, 64, 128."},
  {q:"Pod ktorými váhami sú jednotky?",o:["128, 32, 4, 2","64, 32, 8, 1","64, 16, 8, 1","1, 8, 16, 64, 128"],c:2,ex:"0 1 0 1 1 0 0 1 pod váhami 128 64 32 16 8 4 2 1 – jednotky sú pod 64, 16, 8 a 1."},
  {q:"Aký je výsledok?",o:["88","89","90","153"],c:1,ex:"64 + 16 + 8 + 1 = 89."}

function ex(title, rows){
  var h='<details><summary>'+title+'</summary><div class="tbl" style="margin-top:10px"><table><tr><th>Príklad</th><th>Riešenie</th></tr>';
  rows.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});
  return h+'</table></div></details>';
}

var ALL = CH.concat(EXTRA);

/* ---------- okruhy do zoznamu ----------
   Kódy A1–A6 dostane šesť kapitol, „Časté chyby" a „Cvičenia" sú bez kódu.
   Z krátkeho názvu sa odreže úvodné poradové číslo – to už nesie kód.
   Je to LEN popiska v zozname, nadpis v obsahu kapitoly ostáva celý. */
var OKRUHY = ALL.map(function(ch, i){
  return {
    id: ch.id,
    kod: i < CH.length ? "A" + (i + 1) : "",
    nazov: ch.short.replace(/^\d+\.\s*/, "")
  };
});

/* ---------- uloženie postupu ----------
   Kľúč ostáva cs-modul-v1, len tvar sa rozšíril z { k2: 1 } na
   { k2: { done:1, good:2, total:3 } }, aby sa dalo spočítať percento
   správnych. Staršia jednotka sa zapisovala VÝHRADNE pri kvíze na
   100 %, takže sa dá verne dopočítať na plný počet otázok.
   Všetko v try/catch – localStorage v súkromnom režime Safari hádže
   výnimku už pri čítaní a modul musí fungovať aj bez ukladania. */
var KEY = "cs-modul-v1", store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
CH.forEach(function(ch){
  if (typeof store[ch.id] === "number") {
    store[ch.id] = { done: 1, good: ch.quiz.length, total: ch.quiz.length };
  }
});
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

function jeDokoncena(id){ var r = store[id]; return !!(r && r.done); }

/* Štatistiky uvítacieho panela. Počíta sa VÝHRADNE zo šiestich kapitol –
   „Časté chyby" a „Cvičenia" kvíz nemajú, takže ani krúžok, ani počty. */
function statistiky(){
  var done = 0, good = 0, total = 0;
  CH.forEach(function(ch){
    var r = store[ch.id];
    if (!r || !r.done) return;
    done++;
    if (typeof r.good === "number" && typeof r.total === "number") { good += r.good; total += r.total; }
  });
  return { pocet: CH.length, done: done, pct: total ? Math.round(good / total * 100) : null };
}

/* ---------- question widget ---------- */
function makeQ(item, label, retry, onDone){
  var box=document.createElement("div"); box.className="q";
  var t=document.createElement("div"); t.className="qt";
  if(label){ var n=document.createElement("span"); n.className="qn"; n.textContent=label; t.appendChild(n); }
  t.appendChild(document.createTextNode(item.q)); box.appendChild(t);
  var opts=document.createElement("div"); opts.className="opts"; box.appendChild(opts);
  var fb=document.createElement("div"); fb.className="fb"; fb.setAttribute("aria-live","polite"); box.appendChild(fb);
  var tries=0, btns=[];
  item.o.forEach(function(txt,i){
    var b=document.createElement("button"); b.type="button"; b.className="opt"; b.textContent=txt;
    b.addEventListener("click",function(){
      tries++;
      if(i===item.c){
        b.classList.add("ok");
        btns.forEach(function(x){x.disabled=true;});
        fb.className="fb show ok"; fb.innerHTML="";
        var s=document.createElement("strong"); s.textContent="Správne."; fb.appendChild(s);
        fb.appendChild(document.createTextNode(item.ex));
        onDone && onDone(tries===1);
      } else {
        b.classList.add("bad");
        if(retry){
          b.disabled=true;
          fb.className="fb show bad"; fb.innerHTML="";
          var s2=document.createElement("strong"); s2.textContent="Ešte raz."; fb.appendChild(s2);
          fb.appendChild(document.createTextNode("Toto nie je ono. Skús inú možnosť."));
        } else {
          btns.forEach(function(x){x.disabled=true;});
          btns[item.c].classList.add("ok");
          fb.className="fb show bad"; fb.innerHTML="";
          var s3=document.createElement("strong"); s3.textContent="Nesprávne. Správna odpoveď: "+item.o[item.c]+".";
          fb.appendChild(s3); fb.appendChild(document.createTextNode(item.ex));
          onDone && onDone(false);
        }
      }
    });
    btns.push(b); opts.appendChild(b);
  });
  return box;
}

/* ---------- bit switches ---------- */
function initBits(){
  var row=document.getElementById("bitsRow"); if(!row) return;
  var state=[0,1,0,1,1,0,0,1], W=[128,64,32,16,8,4,2,1];
  function upd(){
    var sum=0, parts=[];
    state.forEach(function(v,i){ if(v){ sum+=W[i]; parts.push(W[i]); } });
    document.getElementById("bitsBin").textContent=state.join("")+"₂";
    document.getElementById("bitsDec").textContent="= "+sum+"₁₀";
    document.getElementById("bitsSum").textContent=parts.length?parts.join(" + "):"žiadny bit nesvieti";
  }
  W.forEach(function(w,i){
    var b=document.createElement("button"); b.type="button"; b.className="bit";
    b.setAttribute("aria-label","Bit s váhou "+w);
    var v=document.createElement("span"); v.className="v";
    var l=document.createElement("span"); l.className="w"; l.textContent=w;
    b.appendChild(v); b.appendChild(l);
    function paint(){ v.textContent=state[i]; b.setAttribute("aria-pressed",state[i]?"true":"false"); }
    b.addEventListener("click",function(){ state[i]=state[i]?0:1; paint(); upd(); });
    paint(); row.appendChild(b);
  });
  upd();
}

function renderStats(){
  var s = statistiky();
  document.getElementById("statTotal").textContent   = s.pocet;
  document.getElementById("statDone").textContent    = s.done;
  document.getElementById("statCorrect").textContent = s.pct === null ? "—" : s.pct + " %";

  /* Krúžok ukazuje dokončené / 6. Obvod 125,6 zodpovedá polomeru 20
     v SVG vyššie (2·π·20) – rovnaká matematika ako v module LexAreny. */
  var pct = s.pocet ? Math.round(s.done / s.pocet * 100) : 0;
  var obvod = 125.6;
  var ring = document.getElementById("progressRing");
  if (ring) ring.style.strokeDashoffset = obvod - (pct / 100 * obvod);
  document.getElementById("progressText").textContent = pct + "%";
}

    if (o.id === aktivny) b.setAttribute("aria-current", "true");

    var kod = document.createElement("span");
    kod.className = "okruh-num";
    kod.textContent = o.kod;

    var naz = document.createElement("span");
    naz.className = "okruh-title";
    naz.textContent = o.nazov;

    var st = document.createElement("span");
    st.className = "okruh-status";
    st.textContent = jeDokoncena(o.id) ? "✓" : "";
    if (jeDokoncena(o.id)) st.setAttribute("aria-label", "dokončené");

    b.appendChild(kod); b.appendChild(naz); b.appendChild(st);
    b.addEventListener("click", function(){ go(o.id, true); });
    okruhyList.appendChild(b);
  });
  renderStats();
}

/* Výsledok kvízu kapitoly. Drží LEPŠÍ z pokusov – rovnaký princíp ako
   writeOkruhBest v appke, aby opakovanie kvízu nemohlo skóre zhoršiť. */
function zapisVysledok(ch, good){
  var r = store[ch.id];
  var najlepsi = (r && typeof r.good === "number") ? r.good : -1;
  if (good > najlepsi) store[ch.id] = { done: 1, good: good, total: ch.quiz.length };
  else if (r) r.done = 1;
  save();
  renderSidebar(ch.id);
}

/* ---------- obsah kapitoly ---------- */
function render(id){
  var idx = ALL.findIndex(function(c){ return c.id === id; });
  if (idx < 0) idx = 0;
  var ch = ALL[idx];
  detail.innerHTML = "";

  var h = document.createElement("h2"); h.textContent = ch.title; detail.appendChild(h);

  if (ch.steps){
    var h3 = document.createElement("h3"); h3.textContent = "Výklad";
    h3.style.borderTop = "0"; h3.style.marginTop = "12px"; h3.style.paddingTop = "0";
    detail.appendChild(h3);
  }
  var body = document.createElement("div"); body.innerHTML = ch.html; detail.appendChild(body);

  if (ch.steps){
    var hc = document.createElement("h3"); hc.textContent = "Riešený prípad"; detail.appendChild(hc);
    var intro = document.createElement("p"); intro.className = "case-intro"; intro.textContent = ch.caseIntro; detail.appendChild(intro);
    var caseBox = document.createElement("div"); detail.appendChild(caseBox);
    (function step(k){
      if (k >= ch.steps.length){
        var d = document.createElement("p"); d.className = "score show";
        d.textContent = "Prípad je vyriešený. Pokračuj kvízom."; caseBox.appendChild(d); return;
      }
      caseBox.appendChild(makeQ(ch.steps[k], "Krok " + (k + 1) + " z " + ch.steps.length, true, function(){ step(k + 1); }));
    })(0);

    var hq = document.createElement("h3"); hq.textContent = "Kvíz"; detail.appendChild(hq);
    var qp = document.createElement("p"); qp.textContent = "Každá otázka má jeden pokus. Po odpovedi uvidíš vysvetlenie."; detail.appendChild(qp);
    var answered = 0, good = 0;
    var sc = document.createElement("div"); sc.className = "score"; sc.setAttribute("aria-live", "polite");
    ch.quiz.forEach(function(q, i){
      detail.appendChild(makeQ(q, "Otázka " + (i + 1) + " z " + ch.quiz.length, false, function(ok){
        answered++; if (ok) good++;
        if (answered === ch.quiz.length){
          sc.textContent = "Výsledok: " + good + " z " + ch.quiz.length + " správne." + (good === ch.quiz.length ? " Výborne, kapitola je zvládnutá." : " Prejdi si výklad ešte raz a skús kvíz znova.");
          sc.classList.add("show");
          zapisVysledok(ch, good);
          if (good < ch.quiz.length){
            var again = document.createElement("button");
            again.type = "button"; again.className = "btn ghost"; again.style.marginTop = "10px";
            again.textContent = "Skúsiť kvíz znova";
            again.addEventListener("click", function(){ go(ch.id, true); });
            sc.appendChild(document.createElement("br")); sc.appendChild(again);
          }
        }
      }));
    });
    detail.appendChild(sc);
  }

  var pg = document.createElement("div"); pg.className = "pager";
  if (idx > 0){
    var p = document.createElement("button"); p.type = "button"; p.className = "btn ghost";
    p.textContent = "← " + ALL[idx - 1].short;
    p.addEventListener("click", function(){ go(ALL[idx - 1].id, true); });
    pg.appendChild(p);
  } else pg.appendChild(document.createElement("span"));
  if (idx < ALL.length - 1){
    var nx = document.createElement("button"); nx.type = "button"; nx.className = "btn";
    nx.textContent = "Ďalej: " + ALL[idx + 1].short;
    nx.addEventListener("click", function(){ go(ALL[idx + 1].id, true); });
    pg.appendChild(nx);
  }
  detail.appendChild(pg);

  initBits();
  renderSidebar(ch.id);
}

/* ---------- prepínanie zoznam ↔ okruh ----------
   Na desktope sú oba panely vedľa seba a prepína sa len to, či vpravo
   stojí uvítací panel alebo obsah okruhu. Na mobile (≤768 px) určuje
   atribút data-view, ktorý z nich je vôbec na obrazovke – pozri
   poznámku pri @media v hlavičke. */
function jeMobil(){
  try { return window.matchMedia("(max-width: 768px)").matches; }
  catch (e) { return window.innerWidth <= 768; }
}

function setView(v){
  document.body.setAttribute("data-view", v);
  backLabel.textContent = (v === "detail" && jeMobil()) ? "Okruhy" : "Finančná liga";
}

function zobrazZoznam(){
  welcome.style.display = "block";
  detail.style.display = "none";
  if (location.hash) history.replaceState(null, "", location.pathname);
  renderSidebar(null);
  setView("list");
  window.scrollTo(0, 0);
}

function go(id, scroll){
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  render(id);
  welcome.style.display = "none";
  detail.style.display = "block";
  setView("detail");
  if (scroll){
    window.scrollTo(0, 0);
    try { detail.focus({ preventScroll: true }); } catch (e) {}
  }
}

backBtn.addEventListener("click", function(){
  if (jeMobil() && document.body.getAttribute("data-view") === "detail") zobrazZoznam();
  else location.href = "/";
});

/* Po otočení telefónu alebo zmene šírky treba prepočítať popisku šípky
   (na desktope vedie vždy do appky, na mobile v okruhu späť na zoznam). */
window.addEventListener("resize", function(){
  setView(document.body.getAttribute("data-view") || "list");
});

window.addEventListener("hashchange", function(){
  var id = location.hash.slice(1);
  if (id && ALL.some(function(c){ return c.id === id; })) go(id, false);
  else zobrazZoznam();
});

/* ---------- prepínač témy ----------
   Zapisuje ten istý kľúč lex_theme ako theme.js v appke, takže sa
   modul a appka nemôžu rozísť. */
function aktualnaTema(){
  return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
}
function nastavIkonu(t){
  var i = document.getElementById("themeIcon");
  if (!i) return;
  i.innerHTML = t === "dark"
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>'
    : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var t = aktualnaTema() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("lex_theme", t); } catch (e) {}
  nastavIkonu(t);
});
nastavIkonu(aktualnaTema());

/* ---------- štart ---------- */
var start = location.hash.slice(1);
if (start && ALL.some(function(c){ return c.id === start; })) go(start, false);
else zobrazZoznam();

})();
</script>
